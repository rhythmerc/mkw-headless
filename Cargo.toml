# Mario Kart Wii as a buildAR engine, over WiiCompiled's static recompilation of the player's own disc. No game data
# is here: the game's translated code is made on the player's machine from their disc.
[workspace]
members = ["rust/mkw-engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[profile.dev]
opt-level = 3

# (brres-sys with its C strings typed for arm64 too: third_party/brres-sys/BUILDAR.md)
[patch.crates-io]
brres-sys = { path = "third_party/brres-sys" }

# The engine contract's local checkout (a sibling of this repo), as the app builds it: its newest (Mode::Race,
# ready_to_place) isn't published yet.
[patch."https://github.com/rhythmerc/buildar-engine-core"]
engine-core = { path = "../buildar-engine-core" }
