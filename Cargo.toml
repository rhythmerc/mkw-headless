# Mario Kart Wii as a buildAR engine, over WiiCompiled's static recompilation of the player's own disc. No game data
# is here: the game's translated code is made on the player's machine from their disc.
[workspace]
members = ["rust/mkw-engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[profile.dev]
opt-level = 3
