[package]
name = "mkw-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Mario Kart Wii's side of the buildAR engine contract: its collision (KCL) made from a stage, and more as it comes."

[lib]
name = "mkw_engine"
path = "src/lib.rs"

[dependencies]
glam = "=0.30.10"
# The engine contract (a host pins the same revision).
engine-core = { git = "https://github.com/rhythmerc/buildar-engine-core", rev = "1d66ba37ca305a637ba547fb77aa389539bee9c8" }
# The game, built from the player's own disc, is loaded where they keep it: never linked.
libloading = "0.8"
# The game's models (BRRES/MDL0) and textures from the player's disc: riidefi's readers (RiiStudio's librii).
brres = "0.1.7"
gctex = "0.3.12"

[dev-dependencies]
png = "0.18"
